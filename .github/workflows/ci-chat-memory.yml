name: One-time reviewed-memory lifecycle validation
on:
  push:
    branches:
      - ci/athenz-chat-memory-20261016
permissions:
  contents: read
concurrency:
  group: athenz-chat-memory-20261016
  cancel-in-progress: true
jobs:
  regression:
    name: Python 3.11 on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e .
      - name: Remove temporary trigger from policy test checkout
        run: python -c "from pathlib import Path; Path('.github/workflows/ci-chat-memory.yml').unlink()"
      - name: Manual CI policy
        run: python -m unittest tests.test_ci_budget -v
      - name: Compile edited files
        run: python -m compileall -q athenz/learning.py athenz/cli.py athenz/desktop.py tests/test_chat_memory_capture.py
      - name: New and existing memory/desktop tests
        run: python -m unittest tests.test_chat_memory_capture tests.test_learning tests.test_identity tests.test_desktop tests.test_chat_context_guard -v
      - name: Full Python regression
        run: python -m unittest discover -s tests -v
