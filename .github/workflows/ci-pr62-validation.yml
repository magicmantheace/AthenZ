name: AthenZ PR62 isolated Windows validation

# Disposable branch-scoped CI for explicit owner-authorized validation.
# Never merge this workflow into main.
on:
  push:
    branches:
      - ci/athenz-pr62-validation-20261015

permissions:
  contents: read

concurrency:
  group: athenz-pr62-one-time
  cancel-in-progress: true

jobs:
  core-tests:
    name: Full Windows Python 3.11 regression suite
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project
        run: python -m pip install -e .
      - name: Restore PR source-tree CI policy for tests
        # This validation-only push workflow does not exist on the PR head.
        # Remove ONLY the temporary runner workflow from the checked-out
        # workspace before tests audit the checked-out workflows.
        run: |
          rm .github/workflows/ci-pr62-validation.yml
          python -m unittest tests.test_ci_budget -v
      - name: Compile changed Python modules
        run: python -m compileall -q athenz/paired_decisions.py athenz/paired_stats.py tests/test_paired_decisions.py tests/test_paired_stats.py
      - name: Run targeted regression tests
        run: python -m unittest tests.test_paired_decisions tests.test_paired_stats -v
      - name: Run entire Python regression suite
        run: python -m unittest discover -s tests -v
