name: Disposable D2 synthetic exchange verification
# One-off public branch; removed before PR merge.
on:
  push:
    branches:
      - integration/d2-durable-synthetic-outbox-20261017
permissions:
  contents: read
concurrency:
  group: d2-synthetic-exchange-20261017
  cancel-in-progress: true
jobs:
  python:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python source compile check
        run: python -m compileall -q athenz tests
      - name: Targeted synthetic D2 tests
        run: python -m unittest discover -s tests -p test_developmental_exchange.py -v
      - name: Remove disposable validation workflow from checkout
        run: python -c "from pathlib import Path; Path('.github/workflows/d2-disposable-exchange-20261017.yml').unlink()"
      - name: Complete Python regression
        run: python -m unittest discover -s tests -q
