name: One-time family review cross-platform tests
on:
  push:
    branches:
      - ci/athenz-family-review-20261015
permissions:
  contents: read
concurrency:
  group: athenz-family-review-20261015
  cancel-in-progress: true
jobs:
  regressions:
    name: Python regression on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e .
      - name: Exclude disposable trigger from checkout during policy tests
        run: python -c "from pathlib import Path; Path('.github/workflows/ci-family-review.yml').unlink()"
      - name: Enforce manual-only CI policy
        run: python -m unittest tests.test_ci_budget -v
      - name: Compile family audit and CLI
        run: python -m compileall -q athenz/family_audit.py athenz/paired_decisions.py tests/test_family_audit.py
      - name: Targeted family review and paired decision tests
        run: python -m unittest tests.test_family_audit tests.test_paired_decisions -v
      - name: Full Python regression tests
        run: python -m unittest discover -s tests -v
