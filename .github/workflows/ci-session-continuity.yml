name: One-time same-session conversational continuity validation
on:
  push:
    branches:
      - ci/athenz-session-continuity-20261016
permissions:
  contents: read
concurrency:
  group: athenz-session-continuity-20261016
  cancel-in-progress: true
jobs:
  regression:
    name: Python 3.11 on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e .
      - name: Exclude one-time workflow during manual-CI policy test
        run: python -c "from pathlib import Path; Path('.github/workflows/ci-session-continuity.yml').unlink()"
      - name: Manual-only CI policy
        run: python -m unittest tests.test_ci_budget -v
      - name: Compile changed modules and tests
        run: python -m compileall -q athenz/chat_continuity.py athenz/chat.py athenz/desktop.py tests/test_chat_continuity.py
      - name: Targeted same-session and live context integrity tests
        run: python -m unittest tests.test_chat_continuity tests.test_chat tests.test_chat_context_guard tests.test_desktop tests.test_desktop_sessions tests.test_twin_context -v
      - name: Full Python regression
        run: python -m unittest discover -s tests -v
