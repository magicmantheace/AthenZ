name: One-time selective-confidence Twin audit
on:
  push:
    branches:
      - ci/athenz-selective-confidence-20261015
permissions:
  contents: read
concurrency:
  group: athenz-selective-confidence-20261015
  cancel-in-progress: true
jobs:
  regression:
    name: Python 3.11 regression on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e .
      - name: Remove temporary trigger from policy testing worktree
        run: python -c "from pathlib import Path; Path('.github/workflows/ci-selective-confidence.yml').unlink()"
      - name: Manual-only CI policy
        run: python -m unittest tests.test_ci_budget -v
      - name: Compile edited Python
        run: python -m compileall -q athenz/paired_stats.py athenz/paired_decisions.py athenz/frozen_decision_plan.py tests/test_selective_confidence.py
      - name: Run focused confidence and frozen-plan checks
        run: python -m unittest tests.test_selective_confidence tests.test_paired_stats tests.test_paired_decisions tests.test_frozen_decision_plan tests.test_category_diversity -v
      - name: Run full Python suite
        run: python -m unittest discover -s tests -v
