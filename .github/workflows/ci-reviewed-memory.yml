name: One-time reviewed memory manager cross-platform validation
on:
  push:
    branches:
      - ci/athenz-reviewed-memory-20261016
permissions:
  contents: read
concurrency:
  group: athenz-reviewed-memory-20261016
  cancel-in-progress: true
jobs:
  regression:
    name: Python 3.11 on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e .
      - name: Remove temporary validation workflow before CI policy check
        run: python -c "from pathlib import Path; Path('.github/workflows/ci-reviewed-memory.yml').unlink()"
      - name: CI budget policy
        run: python -m unittest tests.test_ci_budget -v
      - name: Compile reviewed memory changes
        run: python -m compileall -q athenz/desktop.py tests/test_reviewed_memory_management.py
      - name: Targeted owner memory and desktop checks
        run: python -m unittest tests.test_reviewed_memory_management tests.test_desktop tests.test_chat_memory_capture tests.test_twin_context tests.test_desktop_shutdown -v
      - name: Full Python regression suite
        run: python -m unittest discover -s tests -v
