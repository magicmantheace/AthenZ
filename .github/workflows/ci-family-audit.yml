name: One-time family audit cross-platform regression
on:
  push:
    branches:
      - ci/athenz-family-audit-20261015
permissions:
  contents: read
concurrency:
  group: athenz-family-audit-20261015
  cancel-in-progress: true
jobs:
  checks:
    name: Regression on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e .
      - name: Remove validation-only trigger from checked-out test workspace
        run: python -c "from pathlib import Path; Path('.github/workflows/ci-family-audit.yml').unlink()"
      - name: Confirm manual-only policy
        run: python -m unittest tests.test_ci_budget -v
      - name: Python compilation
        run: python -m compileall -q athenz/family_audit.py athenz/paired_decisions.py tests/test_family_audit.py
      - name: Targeted tests
        run: python -m unittest tests.test_family_audit tests.test_paired_decisions -v
      - name: Full Python regression suite
        run: python -m unittest discover -s tests -v
