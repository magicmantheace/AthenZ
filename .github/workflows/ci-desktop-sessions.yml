name: One-time desktop conversation management regression
on:
  push:
    branches:
      - ci/athenz-desktop-sessions-20261016
permissions:
  contents: read
concurrency:
  group: athenz-desktop-sessions-20261016
  cancel-in-progress: true
jobs:
  regression:
    name: Python 3.11 on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e .
      - name: Remove one-time workflow before policy verification
        run: python -c "from pathlib import Path; Path('.github/workflows/ci-desktop-sessions.yml').unlink()"
      - name: Manual-only CI policy
        run: python -m unittest tests.test_ci_budget -v
      - name: Compile implementation and synthetic tests
        run: python -m compileall -q athenz/learning.py athenz/desktop.py tests/test_desktop_sessions.py
      - name: Session management and chat targeted checks
        run: python -m unittest tests.test_desktop_sessions tests.test_desktop tests.test_chat_memory_capture tests.test_chat_context_guard tests.test_desktop_shutdown -v
      - name: Complete Python regression
        run: python -m unittest discover -s tests -v
