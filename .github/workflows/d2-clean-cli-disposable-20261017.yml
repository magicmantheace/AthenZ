name: Disposable D2 reviewed-source CLI clean-base validation
on:
  push:
    branches:
      - feature/d2-source-review-cli-mainline-20261017
permissions:
  contents: read
jobs:
  python:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python tree
        run: python -m compileall -q athenz tests
      - name: CLI and source permission regression
        run: |
          python -m unittest discover -s tests -p test_developmental_consent_cli.py -v
          python -m unittest discover -s tests -p test_developmental_consent.py -v
          python -m unittest discover -s tests -p test_developmental_exchange.py -v
      - name: Remove disposable workflow in checkout
        run: python -c "from pathlib import Path; Path('.github/workflows/d2-clean-cli-disposable-20261017.yml').unlink()"
      - name: Full Python regression on Linux
        if: runner.os == 'Linux'
        run: python -m unittest discover -s tests -q
