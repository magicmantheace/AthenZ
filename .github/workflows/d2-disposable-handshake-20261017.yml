name: Disposable synthetic D2 key handshake CI
on:
  push:
    branches:
      - integration/d2-synthetic-session-handshake-20261017
permissions:
  contents: read
jobs:
  tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile module and tests
        run: python -m compileall -q athenz tests
      - name: Handshake and source review unit tests
        run: |
          python -m unittest discover -s tests -p test_developmental_handshake.py -v
          python -m unittest discover -s tests -p test_developmental_consent.py -v
      - name: Delete temporary workflow in checkout
        run: python -c "from pathlib import Path; Path('.github/workflows/d2-disposable-handshake-20261017.yml').unlink()"
      - name: Full Linux Python regression
        if: runner.os == 'Linux'
        run: python -m unittest discover -s tests -q
