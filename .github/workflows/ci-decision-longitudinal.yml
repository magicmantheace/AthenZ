name: One-time longitudinal Twin decision cross-platform checks
on:
  push:
    branches:
      - ci/athenz-decision-longitudinal-20261015
permissions:
  contents: read
concurrency:
  group: athenz-decision-longitudinal-20261015
  cancel-in-progress: true
jobs:
  regression:
    name: Python regression on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project
        run: python -m pip install -e .
      - name: Exclude one-time trigger from working tree during policy tests
        run: python -c "from pathlib import Path; Path('.github/workflows/ci-decision-longitudinal.yml').unlink()"
      - name: Manual CI policy
        run: python -m unittest tests.test_ci_budget -v
      - name: Compile new module and test
        run: python -m compileall -q athenz/decision_longitudinal.py tests/test_decision_longitudinal.py
      - name: Longitudinal and paired decision targeted tests
        run: python -m unittest tests.test_decision_longitudinal tests.test_paired_decisions tests.test_category_diversity -v
      - name: Full Python suite
        run: python -m unittest discover -s tests -v
