name: AthenZ archival integration validation (isolated)

# This CI-only branch is the event trigger; the reviewed source below stays
# manual-only and does not acquire automatic Actions triggers.
on:
  push:
    branches: [ci/public-archive-reconciliation-20261013]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: athenz-public-archive-reconciliation
  cancel-in-progress: true

jobs:
  regression:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.12'
          - os: ubuntu-latest
            python: '3.13'
          - os: windows-latest
            python: '3.11'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b1cdaa664acd27c0bf5c47fe73afe8e0d65cccca
          persist-credentials: false
      - name: Verify exact reviewed source
        shell: bash
        run: test "$(git rev-parse HEAD)" = "b1cdaa664acd27c0bf5c47fe73afe8e0d65cccca"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install package
        run: python -m pip install -e .
      - name: Full unittest regression
        run: python -m unittest discover -s tests -v

  portable:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b1cdaa664acd27c0bf5c47fe73afe8e0d65cccca
          persist-credentials: false
      - name: Verify exact reviewed source
        shell: bash
        run: test "$(git rev-parse HEAD)" = "b1cdaa664acd27c0bf5c47fe73afe8e0d65cccca"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Package unsigned portable desktop
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check . 'pyinstaller==6.16.0'
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name AthenZ --collect-submodules athenz packaging/desktop_launcher.py
          $exe = (Resolve-Path 'dist/AthenZ/AthenZ.exe').Path
          foreach ($arg in @('--self-test', '--gui-self-test')) {
            $p = Start-Process -FilePath $exe -ArgumentList $arg -PassThru
            if (-not $p.WaitForExit(30000)) {
              Stop-Process -Id $p.Id -Force
              throw "Portable executable $arg timed out"
            }
            if ($p.ExitCode -ne 0) { throw "Portable executable $arg failed" }
          }
