name: Disposable D2 interoperability regression
# Branch-only synthetic validation; remove before merge.
on:
  push:
    branches:
      - integration/d2-interoperability-vector-v1
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Synthetic wire tests
        run: python -m unittest discover -s tests -p test_d2_wire_compatibility.py -v
      - name: Full Python regression with disposable workflow removed in checkout
        run: |
          rm .github/workflows/d2-oneoff-20261017.yml
          python -m unittest discover -s tests -q
  windows:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Windows synthetic wire tests
        run: python -m unittest discover -s tests -p test_d2_wire_compatibility.py -v
