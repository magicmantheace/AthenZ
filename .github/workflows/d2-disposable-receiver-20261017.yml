name: Disposable D2 durable framed receiver regression
on:
  push:
    branches:
      - integration/d2-durable-framed-receiver-20261017
permissions:
  contents: read
concurrency:
  group: d2-durable-framed-receiver-20261017
  cancel-in-progress: true
jobs:
  python:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile source and tests
        run: python -m compileall -q athenz tests
      - name: Durable receiver and ACK regression
        run: |
          python -m unittest discover -s tests -p test_developmental_receiver.py -v
          python -m unittest discover -s tests -p test_developmental_ack.py -v
          python -m unittest discover -s tests -p test_developmental_subprocess.py -v
          python -m unittest discover -s tests -p test_developmental_frames.py -v
      - name: Remove disposable workflow from policy audit
        run: python -c "from pathlib import Path; Path('.github/workflows/d2-disposable-receiver-20261017.yml').unlink()"
      - name: Complete Python 3.11 suite on Linux
        if: runner.os == 'Linux'
        run: python -m unittest discover -s tests -q
