name: One-time frozen Twin protocol cross-platform check
on:
  push:
    branches:
      - ci/athenz-frozen-plan-20261015
permissions:
  contents: read
concurrency:
  group: athenz-frozen-plan-20261015
  cancel-in-progress: true
jobs:
  regression:
    name: Python 3.11 regression on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e .
      - name: Remove validation-only CI trigger from checkout
        run: python -c "from pathlib import Path; Path('.github/workflows/ci-frozen-plan.yml').unlink()"
      - name: CI-policy checks
        run: python -m unittest tests.test_ci_budget -v
      - name: Compile frozen and paired evaluator
        run: python -m compileall -q athenz/frozen_decision_plan.py athenz/paired_decisions.py tests/test_frozen_decision_plan.py
      - name: Targeted frozen and paired benchmarks
        run: python -m unittest tests.test_frozen_decision_plan tests.test_paired_decisions tests.test_category_diversity tests.test_family_audit -v
      - name: Full Python suite
        run: python -m unittest discover -s tests -v
