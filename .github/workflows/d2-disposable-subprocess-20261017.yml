name: Disposable D2 separate-process stdio CI
on:
  push:
    branches:
      - fix/d2-buffered-stdio-send
permissions:
  contents: read
concurrency:
  group: d2-buffered-stdio-send
  cancel-in-progress: true
jobs:
  python:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile project
        run: python -m compileall -q athenz tests
      - name: D2 buffered-send and separate-process focused tests
        run: |
          python -m unittest discover -s tests -p test_developmental_frames_flush.py -v
          python -m unittest discover -s tests -p test_developmental_subprocess.py -v
          python -m unittest discover -s tests -p test_developmental_frames.py -v
          python -m unittest discover -s tests -p test_developmental_pipe.py -v
      - name: Remove disposable workflow before policy audit
        run: python -c "from pathlib import Path; Path('.github/workflows/d2-disposable-subprocess-20261017.yml').unlink()"
      - name: Full Python 3.11 suite
        run: python -m unittest discover -s tests -q
