name: One-time synthetic Twin Agent chat smoke validation
on:
  push:
    branches:
      - ci/athenz-local-chat-smoke-20261016
permissions:
  contents: read
concurrency:
  group: athenz-local-chat-smoke-20261016
  cancel-in-progress: true
jobs:
  regression:
    name: Python 3.11 on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project
        run: python -m pip install -e .
      - name: Remove one-time workflow before CI budget policy
        run: python -c "from pathlib import Path; Path('.github/workflows/ci-local-chat-smoke.yml').unlink()"
      - name: Check manual CI budget
        run: python -m unittest tests.test_ci_budget -v
      - name: Compile changed Python
        run: python -m compileall -q athenz/synthetic_chat_smoke.py athenz/desktop.py tests/test_synthetic_chat_smoke.py
      - name: Targeted synthetic and desktop regression
        run: python -m unittest tests.test_synthetic_chat_smoke tests.test_desktop tests.test_desktop_readiness tests.test_chat_context_guard tests.test_inference_readiness -v
      - name: Full Python suite
        run: python -m unittest discover -s tests -v
