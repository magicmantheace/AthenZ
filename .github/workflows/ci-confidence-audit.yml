name: One-time confidence audit validation

# Isolated validation only; this file must not merge into main.
on:
  push:
    branches:
      - ci/athenz-confidence-audit-20261015

permissions:
  contents: read

concurrency:
  group: athenz-confidence-audit-20261015
  cancel-in-progress: true

jobs:
  regression:
    name: Python tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install application
        run: python -m pip install -e .
      - name: Remove disposable trigger from test workspace
        run: python -c "from pathlib import Path; Path('.github/workflows/ci-confidence-audit.yml').unlink()"
      - name: Confirm repository manual-only CI policy
        run: python -m unittest tests.test_ci_budget -v
      - name: Compile changed modules
        run: python -m compileall -q athenz/paired_decisions.py athenz/paired_stats.py tests/test_paired_decisions.py tests/test_paired_stats.py
      - name: Targeted paired decision tests
        run: python -m unittest tests.test_paired_decisions tests.test_paired_stats -v
      - name: Full Python suite
        run: python -m unittest discover -s tests -v
