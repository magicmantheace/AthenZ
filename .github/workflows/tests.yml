name: Python tests (Twin branch and manual)

# Explicit owner approval (2026-10-20): run Linux smoke on pushes to
# the Twin development branch. Full Linux/Windows matrix stays manual.
on:
  push:
    branches:
      - feat/twin-first-evidence-boundaries-20261020
  workflow_dispatch:
    inputs:
      coverage:
        description: 'smoke = one Linux 3.11 job; full = Linux 3.11/3.12/3.13 + Windows 3.11'
        required: true
        type: choice
        options:
          - smoke
          - full
        default: smoke

permissions:
  contents: read

concurrency:
  group: athenz-twin-python-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    if: github.event_name == 'push' || inputs.coverage == 'smoke'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e .
      - name: Run Python tests
        run: python -m unittest discover -s tests -v
      - name: Confirm bounded CI policy
        run: python -m unittest tests.test_ci_budget -v

  full:
    if: inputs.coverage == 'full' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[full-ci]'))
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.11'
          - os: ubuntu-latest
            python-version: '3.12'
          - os: ubuntu-latest
            python-version: '3.13'
          - os: windows-latest
            python-version: '3.11'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e .
      - name: Run Python tests
        run: python -m unittest discover -s tests -v
      - name: Confirm bounded CI policy
        run: python -m unittest tests.test_ci_budget -v
