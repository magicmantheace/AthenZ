name: Python tests (manual, budget-controlled)

# NO automatic push, pull_request, scheduled, or release runs.
# Do not enable additional triggers without explicit owner approval.
on:
  workflow_dispatch:
    inputs:
      coverage:
        description: 'smoke = one Linux 3.11 job; full = Linux 3.11/3.12/3.13 + Windows 3.11'
        required: true
        type: choice
        options:
          - smoke
          - full
        default: smoke

permissions:
  contents: read

concurrency:
  group: athenz-manual-python-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    if: inputs.coverage == 'smoke'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e .
      - name: Run Python tests
        run: python -m unittest discover -s tests -v
      - name: Confirm manual-only CI policy
        run: python -m unittest tests.test_ci_budget -v

  full:
    if: inputs.coverage == 'full'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.11'
          - os: ubuntu-latest
            python-version: '3.12'
          - os: ubuntu-latest
            python-version: '3.13'
          - os: windows-latest
            python-version: '3.11'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e .
      - name: Run Python tests
        run: python -m unittest discover -s tests -v
      - name: Confirm manual-only CI policy
        run: python -m unittest tests.test_ci_budget -v
