name: Disposable D2 bridge validation

# Temporary, single-feature synthetic-only CI. Remove before any merge.
on:
  push:
    branches:
      - integration/developmental-bridge-d2-v1

permissions:
  contents: read

jobs:
  synthetic-bridge:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax
        run: python -m compileall -q athenz tests
      - name: Synthetic D2 bridge regression
        run: python -m unittest discover -s tests -p test_developmental_bridge.py -v
      - name: Remove disposable trigger in checkout before policy check
        run: python -c "from pathlib import Path; Path('.github/workflows/d2-disposable-ci-20261017.yml').unlink()"
      - name: Complete baseline Python regression
        run: python -m unittest discover -s tests -q
