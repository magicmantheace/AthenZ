name: One-time approved memory audit regression
on:
  push:
    branches:
      - ci/athenz-memory-consistency-20261016
permissions:
  contents: read
concurrency:
  group: athenz-memory-consistency-20261016
  cancel-in-progress: true
jobs:
  regression:
    name: Python 3.11 on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e .
      - name: Remove one-time auto-trigger for CI budget check
        run: python -c "from pathlib import Path; Path('.github/workflows/ci-memory-consistency.yml').unlink()"
      - name: Manual-only CI policy
        run: python -m unittest tests.test_ci_budget -v
      - name: Compile edited Python
        run: python -m compileall -q athenz/memory_consistency.py athenz/memory_consistency_panel.py athenz/desktop.py athenz/cli.py tests/test_memory_consistency.py
      - name: Focused consistency and owner memory tests
        run: python -m unittest tests.test_memory_consistency tests.test_reviewed_memory_management tests.test_chat_memory_capture tests.test_desktop tests.test_twin_context -v
      - name: Full Python regression
        run: python -m unittest discover -s tests -v
