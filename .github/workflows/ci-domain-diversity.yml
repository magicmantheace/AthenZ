name: One-time Twin domain diversity validation
on:
  push:
    branches:
      - ci/athenz-domain-diversity-20261015
permissions:
  contents: read
concurrency:
  group: athenz-domain-diversity-20261015
  cancel-in-progress: true
jobs:
  regression:
    name: Python regression on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install AthenZ
        run: python -m pip install -e .
      - name: Remove disposable trigger from test workspace
        run: python -c "from pathlib import Path; Path('.github/workflows/ci-domain-diversity.yml').unlink()"
      - name: Verify manual-only CI policy
        run: python -m unittest tests.test_ci_budget -v
      - name: Compile edited Python
        run: python -m compileall -q athenz/family_audit.py athenz/paired_decisions.py tests/test_category_diversity.py
      - name: Run focused Twin evaluation tests
        run: python -m unittest tests.test_category_diversity tests.test_family_audit tests.test_paired_decisions -v
      - name: Run complete AthenZ Python suite
        run: python -m unittest discover -s tests -v
